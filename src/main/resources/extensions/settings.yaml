apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-lyxyImage-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: select
          name: filePolicy
          key: filePolicy
          id: filePolicy
          label: 附件存储策略
          searchable: true
          help: "封面图转存使用的附件存储策略"
          action: /apis/storage.halo.run/v1alpha1/policies
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
        - $formkit: select
          name: randomType
          key: randomType
          id: randomType
          label: 随机图类型
          validation: required
          value: "acg"
          help: "图源固定为自动降级链：t.alcy.cc/ycy（默认首选）→ t.alcy.cc/moe → t.alcy.cc/pc → dmoe.cc → Bing 官方 → Bing 代理；只有全部失效才会报错。"
          options:
            - label: 二次元
              value: acg
            - label: 风景
              value: views
            - label: 全类型4K
              value: all4k
    - group: ai
      label: AI 生成设置
      formSchema:
        - $formkit: select
          name: aiProvider
          key: aiProvider
          id: aiProvider
          label: 生成平台
          validation: required
          value: "openai"
          help: "当前仅支持 OpenAI 兼容格式（兼容 OpenAI Images API 及各类自称 OpenAI 兼容的服务）"
          options:
            - label: OpenAI 兼容
              value: "openai"
        - $formkit: text
          name: apiBaseUrl
          key: apiBaseUrl
          id: apiBaseUrl
          label: API 基础地址
          validation: required
          value: "https://api.openai.com/v1"
          help: "需包含版本段，例如 https://api.openai.com/v1；实际请求 {基础地址}/images/generations"
        - $formkit: password
          name: apiKey
          key: apiKey
          id: apiKey
          label: API Key
          help: "以 Bearer 方式发送的密钥"
        - $formkit: text
          name: model
          key: model
          id: model
          label: 模型名称
          validation: required
          value: "gpt-image-1"
          help: "按服务商支持的模型名填写，例如 gpt-image-1、doubao-seedream-4-0-250828、qwen-image 等"
        - $formkit: textarea
          name: promptTemplate
          key: promptTemplate
          id: promptTemplate
          label: 提示词模板
          value: "为这篇博客文章生成一张精美的封面图片。文章标题：{title}。文章内容摘要：{content}"
          help: "支持占位符: {title} 文章标题, {content} 文章内容"
          rows: 3
